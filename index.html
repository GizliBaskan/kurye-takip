<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Motokurye Takip · 2026</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

<!-- === FIREBASE KÜTÜPHANELERİ === -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>

<!-- === STİL DOSYALARI (CSS) === -->
<style>
:root{
  --bg:#0a0e14;--elev:#111820;--card:#151d28;--hover:#1a2433;
  --border:#1e2a3a;--border2:#2a3a4f;
  --text:#f0f4f8;--sec:#94a3b8;--muted:#64748b;
  --accent:#38bdf8;--accent-dim:rgba(56,189,248,.15);
  --green:#34d399;--green-dim:rgba(52,211,153,.12);
  --red:#f87171;--red-dim:rgba(248,113,113,.12);
  --amber:#fbbf24;--amber-dim:rgba(251,191,36,.12);
  --violet:#a78bfa;--violet-dim:rgba(167,139,250,.12);
  --orange:#fb923c;
  --r:14px;--rs:8px;
  --font:'DM Sans',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;line-height:1.55;-webkit-font-smoothing:antialiased}

/* GİRİŞ EKRANI STİLLERİ */
#auth-screen {
  position: fixed; inset: 0; background: var(--bg); z-index: 1000;
  display: flex; align-items: center; justify-content: center; padding: 1rem;
  overflow-y: auto;
}
.auth-box {
  background: var(--card); border: 1px solid var(--border); border-radius: var(--r);
  padding: 1.5rem; width: 100%; max-width: 360px; text-align: center;
  box-shadow: 0 12px 32px rgba(0,0,0,0.4);
}
.auth-box h2 { font-size: 1.3rem; margin-bottom: 0.3rem; color: var(--text); }
.auth-box p { font-size: 0.8rem; color: var(--muted); margin-bottom: 1.2rem; }
.auth-input {
  width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--text);
  padding: 0.7rem 0.9rem; border-radius: var(--rs); font-size: 16px; margin-bottom: 0.8rem; outline: none;
}
.auth-input:focus { border-color: var(--accent); }
.auth-btn {
  width: 100%; padding: 0.75rem; border: none; border-radius: var(--rs); font-weight: 600;
  cursor: pointer; transition: 0.2s; font-size: 0.9rem; margin-bottom: 0.6rem;
}
.auth-login-btn { background: var(--accent); color: #0a0e14; }
.auth-login-btn:hover { filter: brightness(1.1); }
.auth-reg-btn { background: transparent; border: 1px solid var(--border); color: var(--sec); }
.auth-reg-btn:hover { background: var(--hover); color: var(--text); }
#auth-error { color: var(--red); font-size: 0.75rem; margin-top: 0.8rem; display: none; }

/* ANA UYGULAMA STİLLERİ */
.app-container { display: none; min-height: 100vh; }
.app-container.show { display: flex; }

.sidebar{width:248px;background:var(--elev);border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;height:100vh;z-index:50;transition:transform .28s cubic-bezier(.4,0,.2,1)}
.brand{padding:1.4rem 1.35rem 1.2rem;border-bottom:1px solid var(--border); display: flex; justify-content: space-between; align-items: center;}
.logo{display:flex;align-items:center;gap:.7rem;font-weight:700;font-size:1.05rem;letter-spacing:-.03em}
.logo-i{width:36px;height:36px;background:linear-gradient(135deg,#0ea5e9,#38bdf8);border-radius:10px;display:grid;place-items:center;font-size:1.1rem;box-shadow:0 4px 12px rgba(14,165,233,.35)}
.brand .sub{font-size:.72rem;color:var(--muted);margin-top:.35rem;margin-left:2.85rem}
.nav{flex:1;padding:.9rem .7rem;display:flex;flex-direction:column;gap:.2rem}
.nav-item{display:flex;align-items:center;gap:.7rem;padding:.7rem .9rem;border:none;background:transparent;color:var(--sec);font-size:.875rem;font-weight:500;border-radius:10px;cursor:pointer;transition:all .15s;text-align:left;font-family:inherit;width:100%}
.nav-item:hover{background:var(--hover);color:var(--text)}
.nav-item.active{background:var(--accent-dim);color:var(--accent)}
.nav-item svg{width:18px;height:18px;flex-shrink:0;opacity:.85}
.nav-item.active svg{opacity:1}
.foot{padding:1rem 1.1rem;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:.5rem}
.foot-row{display:flex;gap:.5rem}
.foot-row .btn-reset{flex:1}
.btn-reset:disabled{opacity:.35;cursor:not-allowed;color:var(--muted)!important;border-color:var(--border)!important}
.btn-reset{width:100%;font-size:.75rem;padding:.55rem;color:var(--muted);background:transparent;border:1px solid var(--border);border-radius:8px;cursor:pointer;font-family:inherit;transition:all .15s}
.btn-reset:hover{border-color:var(--red);color:var(--red)}
.logout-btn { border-color: var(--border2); color: var(--accent); }
.logout-btn:hover { border-color: var(--accent); background: var(--accent-dim); }
.main{flex:1;margin-left:248px;padding:1.75rem 2rem 3.5rem;max-width:1280px}
.page{display:none}.page.active{display:block;animation:rise .28s ease}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.page-head{margin-bottom:1.6rem}
.page-head h1{font-size:1.55rem;font-weight:700;letter-spacing:-.035em;line-height:1.2}
.page-head p{color:var(--muted);font-size:.875rem;margin-top:.25rem}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:.9rem;margin-bottom:1.5rem}
@media(max-width:1100px){.metrics{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){.metrics{grid-template-columns:1fr}}
.metric{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:1.15rem 1.2rem;position:relative;overflow:hidden;transition:border-color .2s,transform .2s}
.metric:hover{border-color:var(--border2);transform:translateY(-1px)}
.metric::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--ma,var(--accent));opacity:.7}
.metric-label{font-size:.7rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:.4rem}
.metric-value{font-family:var(--mono);font-size:1.35rem;font-weight:500;letter-spacing:-.02em;line-height:1.2}
.metric-sub{font-size:.72rem;color:var(--muted);margin-top:.35rem}
.metric.green{--ma:var(--green)}.metric.green .metric-value{color:var(--green)}
.metric.red{--ma:var(--red)}.metric.red .metric-value{color:var(--red)}
.metric.amber{--ma:var(--amber)}.metric.amber .metric-value{color:var(--amber)}
.metric.violet{--ma:var(--violet)}.metric.violet .metric-value{color:var(--violet)}
.metric.orange{--ma:var(--orange)}.metric.orange .metric-value{color:var(--orange)}
.metric.cyan{--ma:var(--accent)}.metric.cyan .metric-value{color:var(--accent)}
.insights{display:grid;grid-template-columns:repeat(4,1fr);gap:.9rem;margin-bottom:1.5rem}
@media(max-width:1100px){.insights{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){.insights{grid-template-columns:1fr}}
.insight{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:1.1rem 1.2rem;display:flex;gap:1rem;align-items:flex-start}
.insight-icon{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;flex-shrink:0;font-size:1.15rem}
.insight-icon.g{background:var(--green-dim)}.insight-icon.a{background:var(--amber-dim)}.insight-icon.c{background:var(--accent-dim)}.insight-icon.v{background:var(--violet-dim)}
.insight h4{font-size:.8rem;font-weight:600;color:var(--sec);margin-bottom:.2rem}
.insight .val{font-family:var(--mono);font-size:1.05rem;font-weight:500}
.insight .desc{font-size:.72rem;color:var(--muted);margin-top:.15rem}
.best-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.9rem;margin-bottom:1.5rem}
@media(max-width:800px){.best-grid{grid-template-columns:1fr}}
.best-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:1.1rem 1.2rem}
.best-card .tag{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:.5rem}
.best-card .date{font-size:.9rem;font-weight:600;margin-bottom:.15rem}
.best-card .big{font-family:var(--mono);font-size:1.2rem;font-weight:500;color:var(--green)}
.best-card .meta{font-size:.72rem;color:var(--muted);margin-top:.3rem}
.chart-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:.9rem;margin-bottom:1.5rem}
@media(max-width:900px){.chart-grid{grid-template-columns:1fr}}
.chart-box{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:1.2rem 1.3rem 1rem}
.chart-box h3{font-size:.8rem;font-weight:600;color:var(--sec);margin-bottom:1rem}
.chart-area{position:relative;height:220px}
.panel{background:var(--card);border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.toolbar{display:flex;flex-wrap:wrap;gap:.65rem;align-items:center;padding:.9rem 1.1rem;border-bottom:1px solid var(--border);background:var(--elev)}
.toolbar input,.toolbar select{background:var(--bg);border:1px solid var(--border);color:var(--text);padding:.48rem .75rem;border-radius:var(--rs);font-size:.825rem;font-family:inherit;outline:none}
.toolbar input:focus,.toolbar select:focus{border-color:var(--accent)}
.toolbar input{flex:1;min-width:140px}
.btn{display:inline-flex;align-items:center;gap:.35rem;padding:.48rem .95rem;border:none;border-radius:var(--rs);font-size:.825rem;font-weight:600;cursor:pointer;font-family:inherit;transition:all .15s;white-space:nowrap}
.btn-primary{background:linear-gradient(135deg,#0ea5e9,#38bdf8);color:#0a0e14;box-shadow:0 2px 8px rgba(14,165,233,.3)}
.btn-primary:hover{filter:brightness(1.08)}
.btn-ghost{background:transparent;color:var(--sec);border:1px solid var(--border)}
.btn-ghost:hover{background:var(--hover);color:var(--text)}
.btn-danger{background:var(--red-dim);color:var(--red);border:1px solid transparent}
.btn-danger:hover{border-color:var(--red)}
.btn-sm{padding:.28rem .55rem;font-size:.75rem}
.table-scroll{max-height:62vh;overflow:auto}
table{width:100%;border-collapse:collapse;font-size:.8125rem}
thead th{background:var(--elev);padding:.7rem .8rem;text-align:left;font-weight:600;font-size:.68rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);border-bottom:1px solid var(--border);white-space:nowrap;position:sticky;top:0;z-index:2}
tbody td{padding:.5rem .8rem;border-bottom:1px solid var(--border);vertical-align:middle}
tbody tr:hover{background:rgba(56,189,248,.04)}
tbody tr:last-child td{border-bottom:none}
.num{text-align:right;font-family:var(--mono);font-size:.8rem;font-variant-numeric:tabular-nums}
.editable{background:var(--amber-dim);border:1px solid transparent;border-radius:6px;padding:.28rem .45rem;color:var(--text);font-family:var(--mono);font-size:.8rem;width:100%;min-width:64px;outline:none}
.editable:focus{border-color:var(--amber);background:rgba(251,191,36,.18)}
.editable-text{font-family:var(--font);min-width:110px}
.computed{color:var(--sec)}
.neg{color:var(--red)!important}.pos{color:var(--green)!important}
.day-name{color:var(--muted);font-size:.75rem}
.actions{display:flex;gap:.3rem}
.total-row{background:var(--elev)!important;font-weight:600}
.total-row td{border-top:2px solid var(--accent);padding-top:.7rem;padding-bottom:.7rem}
.info-block{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:1.35rem 1.5rem;margin-bottom:1rem}
.info-block h3{font-size:.95rem;font-weight:600;color:var(--accent);margin-bottom:.7rem}
.info-block ul,.info-block ol{padding-left:1.2rem;color:var(--sec);font-size:.875rem}
.info-block li{margin-bottom:.35rem}
.info-block p{color:var(--sec);font-size:.875rem;margin-bottom:.4rem}
.legend{display:flex;flex-wrap:wrap;gap:1.1rem;margin-top:.9rem}
.legend span{display:flex;align-items:center;gap:.4rem;font-size:.8rem;color:var(--muted)}
.swatch{width:12px;height:12px;border-radius:3px}
.overlay{position:fixed;inset:0;background:rgba(5,8,12,.72);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;z-index:100;padding:1rem}
.overlay.show{display:flex}
.modal{background:var(--elev);border:1px solid var(--border2);border-radius:18px;padding:1.6rem;width:100%;max-width:440px;box-shadow:0 24px 64px rgba(0,0,0,.55);animation:rise .25s ease}
.modal h2{font-size:1.1rem;font-weight:700;margin-bottom:1.2rem;letter-spacing:-.02em}
.fg{margin-bottom:.9rem}
.fg label{display:block;font-size:.72rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:.3rem}
.fg input{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:.55rem .8rem;border-radius:var(--rs);font-size:.875rem;font-family:inherit;outline:none}
.fg input:focus{border-color:var(--accent)}
.fg-row{display:grid;grid-template-columns:1fr 1fr;gap:.7rem}
.modal-actions{display:flex;gap:.6rem;justify-content:flex-end;margin-top:1.35rem}
.toast{position:fixed;bottom:1.5rem;right:1.5rem;background:var(--card);border:1px solid var(--border2);color:var(--text);padding:.75rem 1.15rem;border-radius:10px;font-size:.85rem;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,.35);transform:translateY(80px);opacity:0;transition:all .3s cubic-bezier(.4,0,.2,1);z-index:200}
.toast.show{transform:none;opacity:1}.toast.ok{border-color:var(--green)}
.menu-btn{display:none;position:fixed;top:.85rem;left:.85rem;z-index:70;width:42px;height:42px;background:var(--card);border:1px solid var(--border);border-radius:11px;color:var(--text);cursor:pointer;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.sidebar-backdrop{display:none;position:fixed;inset:0;background:rgba(5,8,12,.55);backdrop-filter:blur(3px);z-index:45}
.sidebar-backdrop.show{display:block}
.empty{text-align:center;padding:2.5rem 1rem;color:var(--muted);font-size:.9rem}

.period-nav{display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:1rem 1.3rem;margin-bottom:1.3rem}
.period-nav-left{display:flex;align-items:center;gap:.9rem;flex-wrap:wrap}
.period-nav-title{font-size:1.15rem;font-weight:700;letter-spacing:-.025em;display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}
.period-range{font-size:.76rem;color:var(--muted);font-weight:500;font-family:var(--mono);background:var(--elev);padding:.2rem .55rem;border-radius:6px;border:1px solid var(--border)}
.period-nav-btns{display:flex;align-items:center;gap:.5rem}
.nav-arrow{width:38px;height:38px;border-radius:10px;background:var(--elev);border:1px solid var(--border);color:var(--text);display:grid;place-items:center;cursor:pointer;transition:all .15s;flex-shrink:0}
.nav-arrow:hover:not(:disabled){background:var(--hover);border-color:var(--accent);color:var(--accent)}
.nav-arrow:disabled{opacity:.3;cursor:not-allowed}
.nav-arrow svg{width:18px;height:18px}
.period-jump select{background:var(--bg);border:1px solid var(--border);color:var(--text);padding:.5rem .75rem;border-radius:var(--rs);font-size:.8rem;font-family:inherit;outline:none;cursor:pointer}
.period-jump select:focus{border-color:var(--accent)}
.period-badge{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);background:var(--accent-dim);padding:.28rem .6rem;border-radius:20px}
.delta{font-size:.68rem;font-weight:700;padding:.15rem .5rem;border-radius:7px;margin-left:.5rem;display:inline-flex;align-items:center;gap:.15rem;font-family:var(--mono);vertical-align:middle}
.delta.up{color:var(--green);background:var(--green-dim)}
.delta.down{color:var(--red);background:var(--red-dim)}
.delta.flat{color:var(--muted);background:var(--hover)}
.metric-cmp{font-size:.68rem;color:var(--muted);margin-top:.35rem;display:flex;align-items:center;gap:.3rem;flex-wrap:wrap}
.section-divider{display:flex;align-items:center;gap:.8rem;margin:2rem 0 1.1rem}
.section-divider h2{font-size:.95rem;font-weight:700;color:var(--sec);white-space:nowrap;letter-spacing:-.01em}
.section-divider::after{content:'';flex:1;height:1px;background:var(--border)}
.empty-period{text-align:center;padding:3rem 1rem;color:var(--muted)}
.empty-period .big-emoji{font-size:2.2rem;margin-bottom:.6rem}

/* GPS & KRONOMETRE SAYAÇ WIDGET STİLLERİ */
.gps-box { background: var(--elev); border: 1px solid var(--border2); border-radius: var(--rs); padding: 0.8rem; margin-bottom: 0.9rem; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 0.5rem; }
.gps-info { font-size: 0.78rem; color: var(--sec); font-family: var(--mono); display: flex; gap: 0.8rem; }
.gps-info span { color: var(--accent); font-weight: 700; }
.btn-gps { background: var(--green-dim); color: var(--green); border: 1px solid var(--green); font-size: 0.75rem; padding: 0.35rem 0.65rem; border-radius: 6px; cursor: pointer; font-weight: 600; }
.btn-gps.active { background: var(--red-dim); color: var(--red); border-color: var(--red); }

/* ===== MOBİL MEDYA SORGULARI ===== */
@media(max-width:1024px){
  .metrics{grid-template-columns:repeat(2,1fr)}
  .chart-grid{grid-template-columns:1fr}
  .insights{grid-template-columns:1fr 1fr}
  .best-grid{grid-template-columns:1fr 1fr}
}
@media(max-width:768px){
  .sidebar{transform:translateX(-100%);width:min(280px,86vw);box-shadow:8px 0 32px rgba(0,0,0,.45)}
  .sidebar.open{transform:translateX(0)}
  .main{margin-left:0;padding:4.4rem .85rem 2.8rem;max-width:100%}
  .menu-btn{display:flex}
  .fg-row{grid-template-columns:1fr}
  .page-head{margin-bottom:1.15rem}
  .page-head h1{font-size:1.28rem}
  .page-head p{font-size:.8rem}
  .metrics{grid-template-columns:1fr 1fr;gap:.65rem;margin-bottom:1.1rem}
  .metric{padding:.9rem .95rem}
  .metric-value{font-size:1.15rem}
  .metric-label{font-size:.65rem;margin-bottom:.3rem}
  .metric-sub{font-size:.68rem}
  .insights{grid-template-columns:1fr;gap:.65rem;margin-bottom:1.1rem}
  .insight{padding:.95rem 1rem;gap:.75rem}
  .insight-icon{width:36px;height:36px;font-size:1rem}
  .insight .val{font-size:.98rem}
  .best-grid{grid-template-columns:1fr;gap:.65rem;margin-bottom:1.1rem}
  .best-card{padding:.95rem 1rem}
  .best-card .big{font-size:1.1rem}
  .chart-grid{gap:.65rem;margin-bottom:1.1rem}
  .chart-box{padding:1rem 1rem .85rem}
  .chart-area{height:200px}
  .toolbar{padding:.75rem .85rem;gap:.5rem}
  .toolbar input{min-width:0;flex:1 1 100%;font-size:16px}
  .toolbar select{flex:1 1 auto;min-width:0;font-size:16px}
  .toolbar .btn{flex:1 1 auto;justify-content:center;min-height:40px}
  .table-scroll{max-height:none;overflow-x:auto;-webkit-overflow-scrolling:touch}
  table{font-size:.75rem;min-width:720px}
  thead th{padding:.55rem .5rem;font-size:.62rem}
  tbody td{padding:.4rem .5rem}
  .num{font-size:.74rem}
  .editable{min-width:52px;padding:.35rem .35rem;font-size:.78rem;min-height:36px}
  .editable-text{min-width:90px}
  .btn-sm{min-width:36px;min-height:36px;padding:.35rem;display:inline-flex;align-items:center;justify-content:center}
  .info-block{padding:1.1rem 1.15rem}
  .info-block h3{font-size:.9rem}
  .info-block ul,.info-block ol,.info-block p{font-size:.82rem}
  .modal{padding:1.25rem;border-radius:16px;max-height:90vh;overflow-y:auto}
  .modal h2{font-size:1.05rem}
  .fg input{font-size:16px;padding:.6rem .8rem;min-height:42px}
  .modal-actions .btn{min-height:42px;flex:1;justify-content:center}
  .toast{left:1rem;right:1rem;bottom:1rem;text-align:center}
  .nav-item{padding:.8rem 1rem;min-height:44px;font-size:.9rem}
  .nav-item svg{width:20px;height:20px}
  .period-nav{padding:.85rem .95rem;gap:.7rem}
  .period-nav-left{gap:.6rem;width:100%}
  .period-nav-title{font-size:1rem;width:100%;justify-content:space-between}
  .period-nav-btns{width:100%;justify-content:space-betwe
